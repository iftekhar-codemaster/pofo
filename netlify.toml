[build]
  command = "npx prisma generate && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npm run build"
  publish = ".next"

[build.environment]
  DATABASE_URL = "file:./dev.db"
  JWT_SECRET = "super-secret-jwt-key-for-pofo-admin-2026"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
